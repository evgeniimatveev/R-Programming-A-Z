name: R script smoke run (manual)

# Manual only: click "Run workflow" in the Actions tab. No push / PR / schedule triggers.
on:
  workflow_dispatch:
  push:
    branches: [ci/manual-script-run]   # TEMPORARY: test before merge, removed afterwards

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install packages used by the scripts
        run: Rscript -e 'install.packages(c("ggplot2", "dplyr", "reshape2"))'

      - name: Run every script (see Job Summary for the table)
        run: Rscript .github/scripts/run-scripts.R
