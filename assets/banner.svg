<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="R Programming A-Z banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b3a"/>
      <stop offset="0.6" stop-color="#14306b"/>
      <stop offset="1" stop-color="#276DC3"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#75AADB" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#9fd0ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <!-- decorative histogram / density -->
  <g transform="translate(790 60)">
    <rect x="0"   y="150" width="34" height="60"  rx="4" fill="url(#bar)"/>
    <rect x="42"  y="110" width="34" height="100" rx="4" fill="url(#bar)"/>
    <rect x="84"  y="60"  width="34" height="150" rx="4" fill="url(#bar)"/>
    <rect x="126" y="20"  width="34" height="190" rx="4" fill="url(#bar)"/>
    <rect x="168" y="48"  width="34" height="162" rx="4" fill="url(#bar)"/>
    <rect x="210" y="96"  width="34" height="114" rx="4" fill="url(#bar)"/>
    <rect x="252" y="138" width="34" height="72"  rx="4" fill="url(#bar)"/>
    <rect x="294" y="172" width="34" height="38"  rx="4" fill="url(#bar)"/>
    <rect x="336" y="192" width="34" height="18"  rx="4" fill="url(#bar)"/>
    <path d="M17 160 C 80 120, 120 20, 143 18 S 260 90, 353 200" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <line x1="-10" y1="212" x2="390" y2="212" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  </g>
  <!-- title -->
  <text x="64" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#9fd0ff" letter-spacing="6">LEARN BY DOING</text>
  <text x="62" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#ffffff">R Programming A–Z</text>
  <text x="64" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#dbe9ff">Variables  ·  Vectors  ·  Matrices  ·  Data Frames  ·  ggplot2</text>
</svg>
